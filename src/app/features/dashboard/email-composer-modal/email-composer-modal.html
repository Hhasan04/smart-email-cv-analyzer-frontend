<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" (click)="close.emit()">
  <div
    class="w-full max-w-lg rounded-lg bg-white p-6 shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">{{ title() }}</h2>
      <button type="button" (click)="close.emit()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
        ✕
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700" for="composerSubject">Subject</label>
        <input
          id="composerSubject"
          type="text"
          formControlName="subject"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700" for="composerBody">Body</label>
        <textarea
          id="composerBody"
          formControlName="body"
          rows="8"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none"
        ></textarea>
      </div>

      @if (sendError()) {
        <p class="text-sm text-red-600">{{ sendError() }}</p>
      }

      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="close.emit()"
          class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || submitting()"
          class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
        >
          {{ submitting() ? 'Sending…' : 'Send' }}
        </button>
      </div>
    </form>
  </div>
</div>
